<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pastel Calculator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="background-decoration decoration-one"></div>
    <div class="background-decoration decoration-two"></div>
    <div class="background-decoration decoration-three"></div>


    <main class="calculator-container">

        <div class="calculator-card">

            <div class="top-icons">
                <span>♡</span>
                <span>✦</span>
            </div>


            <div class="title-area">

                <div class="calculator-icon">
                    𝐌𝐀𝑻𝐇
                </div>

                <h1>Simple Calculator</h1>

                <p>
                    A little space for simple calculations
                </p>

            </div>


            <div class="input-group">

                <label for="num1">
                    First Number
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">①</span>

                    <input
                        type="number"
                        id="num1"
                        placeholder="Enter first number"
                        step="any"
                    >

                </div>

            </div>


            <div class="input-group">

                <label for="num2">
                    Second Number
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">②</span>

                    <input
                        type="number"
                        id="num2"
                        placeholder="Enter second number"
                        step="any"
                    >

                </div>

            </div>


            <div class="input-group">

                <label for="operation">
                    Select Operation
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">✧</span>

                    <select id="operation">

                        <option value="">
                            Choose an operation
                        </option>

                        <option value="add">
                            Addition (+)
                        </option>

                        <option value="subtract">
                            Subtraction (−)
                        </option>

                        <option value="multiply">
                            Multiplication (×)
                        </option>

                        <option value="divide">
                            Division (÷)
                        </option>

                        <option value="modulus">
                            Modulus (%)
                        </option>

                    </select>

                </div>

            </div>


            <div class="button-group">

                <button id="calculateBtn"
                        class="calculate-button">

                    <span>Calculate</span>
                    <span class="button-sparkle">✦</span>

                </button>


                <button id="clearBtn"
                        class="clear-button">

                    Clear

                </button>

            </div>


            <div id="resultBox"
                 class="result-box hidden">

                <div class="result-label">
                    YOUR RESULT
                </div>

                <div id="result"
                     class="result-value">

                    0

                </div>

                <div class="result-decoration">
                    ✦ ─── ✧ ─── ✦
                </div>

            </div>


            <div id="errorBox"
                 class="error-box hidden">

                <span>♡</span>

                <span id="errorMessage"></span>

            </div>


            <div class="footer-note">
                Made with ✨ and a little bit of magic
            </div>

        </div>

    </main>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
